{% extends 'base.html' %}
{% block content %}
<style>
    .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 1px solid #ccc;
        padding: 20px;
    }
    .upload-template-wrapper {
        display: flex;
        height: 100vh;
    }
    form {
        text-align: center;
    }
    label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
    }
    input[type="file"] {
        margin-bottom: 10px;
    }
    .button-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
    }
    button:disabled, select:disabled {
        background-color: #f0f0f0;
        cursor: not-allowed;
    }
</style>
<script>
    function lockOption() {
        const fileInput = document.getElementById('docx_file');
        const conversionSelect = document.getElementById('conversion_option');
        const confirmButton = document.getElementById('confirm_button');
        const clearButton = document.getElementById('clear_button');
        if (fileInput.files.length > 0) {
            const uploadedFile = fileInput.files[0];
            const fileType = uploadedFile.name.split('.').pop().toLowerCase();
            if (fileType === 'docx') {
                conversionSelect.value = "DOCX";
            } else if (fileType === 'pdf') {
                conversionSelect.value = "PDF";
            } else {
                alert("Unsupported file type! Please upload a DOCX or PDF file.");
                clearFile();
                return;
            }
            conversionSelect.disabled = true;
            confirmButton.disabled = true;
            clearButton.disabled = false;
        }
    }
    function clearFile() {
        const fileInput = document.getElementById('docx_file');
        const conversionSelect = document.getElementById('conversion_option');
        const confirmButton = document.getElementById('confirm_button');
        const clearButton = document.getElementById('clear_button');
        fileInput.value = "";
        conversionSelect.disabled = false;
        conversionSelect.value = "";
        confirmButton.disabled = false;
        clearButton.disabled = true;
    }
</script>
<div class="upload-template-wrapper">
    <div class="container">
        <form id="uploadForm" action="{% url 'upload_template' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="docx_file">Upload Template Here (DOCX or PDF):</label>
            <input type="file" id="docx_file" name="docx_file" accept=".docx,.pdf" onchange="lockOption()">
            <div class="button-group">
                <button type="submit">Upload</button>
                <button type="button" id="clear_button" onclick="clearFile()" disabled>Clear</button>
            </div>
        </form>
    </div>
    <div class="container">
        <form id="conversionForm" action="{% url 'upload_template' %}" method="POST">
            {% csrf_token %}
            <label for="conversion_option">Choose Desired Format:</label>
            <select id="conversion_option" name="conversion_option" required>
                <option value="" disabled selected>Select an option</option>
                <option value="PDF">PDF</option>
                <option value="DOCX">DOCX</option>
            </select>
            <button type="submit" id="confirm_button">Confirm</button>
        </form>
    </div>
</div>
{% endblock %}
