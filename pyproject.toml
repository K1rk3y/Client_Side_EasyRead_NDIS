jsonschema-specifications = ">=2023.12"
jsonpointer = ">=2.4"
json5 = ">=0.9"
toml = ">=0.10"
tomli = ">=2.0"
tomlkit = ">=0.12"
pyyaml = ">=6.0"
pyyaml-env-tag = ">=0.1"

# HTTP/Networking
requests = ">=2.32"
urllib3 = ">=2.2"
charset-normalizer = ">=3.3"
idna = ">=3.7"
certifi = ">=2024.2"
webdataset = ">=0.2"
