[project]
name = "Client_Side_EasyRead_NDIS"
version = "0.1.0"
description = ""
authors = [
    { name = "Cheng Li", email = "kirkadmiralsfc@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
